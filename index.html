#sb{display:none;position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;background:#0f172a;color:#fff;border-radius:10px;padding:8px 12px;align-items:center;justify-content:space-between;gap:10px;z-index:20}#sb button{min-height:36px}#pv{display:none}.rw{display:flex;flex-direction:column;height:calc(100vh - 132px - env(safe-area-inset-bottom,0px));height:calc(100dvh - 132px - env(safe-area-inset-bottom,0px));min-height:300px}.rg{flex:1;display:grid;gap:8px;grid-auto-rows:1fr;min-height:0}.tile{display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--card);min-height:0}.tile .tt{font:800 clamp(18px,6vw,30px) ui-monospace,Menlo,monospace;text-align:center;line-height:1.1}.tile .big{flex:1;min-height:0;font-size:clamp(15px,4.4vw,26px);font-weight:800;border-radius:10px}.sm{min-height:30px;padding:2px 10px;font-size:12px}

</style></head><body>
<header>練習強度設定 <span class="mut">スマホ版</span></header><main id="m"></main>
<nav id="nav"></nav><div id="sb"></div><div id="dlg"></div><div id="pv"></div>
<script>
const $=s=>document.querySelector(s),KEY='sprint_mobile_v1';
const Z=[['rec','回復',55],['ext','テンポ',70],['int','インテンシブ',85],['se','スピード持久',92],['se2','特殊持久',96],['max','最大スピード',99]];
const ZN=Object.fromEntries(Z.map(z=>[z[0],z[1]])),STD=Object.fromEntries(Z.map(z=>[z[0],z[2]]));
const zk=I=>I>=98?'max':I>=95?'se2':I>=90?'se':I>=80?'int':I>=65?'ext':'rec';
const CAP={rec:[3000,3000],ext:[2000,3000],int:[1200,2000],se:[1000,1000],se2:[900,1200],max:[400,400]};
const REP={rec:[600,800,1000,1000,1000],ext:[200,300,400,400,400],int:[200,250,350,350,350],se:[150,200,300,300,300],se2:[100,120,250,250,250],max:[60,60,120,120,120]};
const PROF={beginner:{n:'初心者中心',d:'入門・初級が多いチーム向け。入門・初級の量と本数を絞り、高強度は週2日まで（中級以上は標準と同じ）。',cs:1,lf:[.5,.7,1,1,1],mr:[4,5,10,10,10],hd:2,wc:3.5},standard:{n:'標準',d:'中級が中心の標準的なチーム向け（初期値）。',cs:1,lf:[.6,.8,1,1,1],mr:[5,6,10,10,10],hd:3,wc:3.5},advanced:{n:'強化（経験者中心）',d:'中級以上が多く、上位大会を目指すチーム向け。上限に余裕をもたせます。',cs:1.15,lf:[.7,.9,1,1,1],mr:[6,8,12,12,12],hd:3,wc:4}};
const P=()=>PROF[S.team]||PROF.standard,EVM={'100':1,'200':1.25,'400':1.6};
const base=()=>{const p=P();return{cap:Object.fromEntries(Object.entries(CAP).map(([k,v])=>[k,v.map(x=>Math.round(x*p.cs/50)*50)])),lf:[...p.lf],mr:[...p.mr],rep:JSON.parse(JSON.stringify(REP)),er:[1,1.25,1.6],wk:{hd:p.hd,wc:p.wc,ml:1}}};
const L=()=>S.lim||base();
const TD={rec:['〜60%（ジョグ〜流し）','100〜400m（ウォークバック）','疲労回復・血流促進、フォーム確認','会話できる楽なペース。ハードな練習の翌日や整理運動に。'],ext:['70〜80%（200m PBの平均速度に対する比）','100〜400m（短い休息で反復）','有酸素能力（基礎体力）の向上と積極的休養','息が少し上がる程度で、乳酸を溜めすぎない。毛細血管を発達させ、回復力を高める身体のベース作り。フォームの確認にも最適。'],int:['80〜90%（200m PBの平均速度に対する比）','100〜400m（テンポよりやや長めの休息）','解糖系（無酸素性）の容量拡張と、乳酸耐性の基礎づくり','乳酸が溜まり始めるゾーン。苦しくてもフォームを崩さず走る土台を作り、スピード持久・特殊持久に耐える準備をする。'],se:['90〜100%','60〜150m程度（7〜15秒前後）','トップスピードの維持（失速を防ぐ）','疲労し始めても速度を落とさない力を鍛える。1本ごとに5〜10分程度の休息を取り、質を落とさず走る。'],se2:['90〜100%','150〜600m程度（15秒以上）','レース本番の極限状態（強い乳酸蓄積）への適応','レース距離に近い距離をほぼ全力で走る最も過酷な練習。15〜20分以上の完全休息を取って次へ。'],max:['98〜100%','20〜60m（加速走・フライング）','最高速度の向上と神経系の刺激','完全休息（60m以下は10mあたり約1〜1.5分）で全力走。質が落ちたら打ち切る。']};
const SEASON={base:['基礎づくり期',1.2,.8],build:['強化期（標準）',1,1],comp:['試合期',.8,.85],taper:['試合前',.5,.6],restart:['再開期',.6,.4]};
const REST={max:d=>d<=60?[Math.max(120,d*6),Math.max(180,d*9)]:d<=150?[480,720]:[900,1500],se2:d=>d<=100?[480,720]:d<=150?[600,900]:d<=300?[900,1200]:[1200,1500],se:d=>d<=60?[180,300]:d<=150?[300,600]:d<=250?[480,720]:[600,900],int:d=>d<=150?[120,180]:d<=250?[180,240]:[240,360],ext:()=>[30,90],rec:()=>null};
const td0=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const def=()=>({tab:'today',date:td0(),gfix:null,gn:0,gsel:null,tm:[],sel:{sid:0,rep:1,g:-1},run:{stage:'ready',t0:0,gs:[],gi:0},restEnd:0,menus:[],hist:[],mo:0,lim:null,notes:{},gsz:4,gdist:'100',gp:0,go:0,rec:1,lastBackup:0,team:'standard',wlog:{},q:'',rq:'',help:'',intensity:85,season:'build',surface:'tartan',shoe:'spike',climate:'normal',start:'blocks',form:1,timing:'auto',wu:30,cd:10,nid:3,
 athletes:[{id:1,name:'選手A',pb100:'11.80',pb200:'24.00',pb400:'',level:3,event:'100',on:1},{id:2,name:'選手B',pb100:'13.00',pb200:'27.00',pb400:'',level:2,event:'100',on:1}],
 sets:[{id:1,v:200,r:3,p:'se',i:92,rest:''},{id:2,v:150,r:1,p:'se2',i:96,rest:''}],extra:{}});
let S;try{S={...def(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S=def()}S.q='';S.rq='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* ---- 計算 ---- */
const pt=v=>{if(v==null)return NaN;let s=String(v).trim().replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/：/g,':').replace(/[秒″"”](?=\d)/g,'.').replace(/[分′'’]/g,':').replace(/[秒″"”\s]/g,'');if(/^\d+\.\d+\.\d+$/.test(s))s=s.replace('.',':');if(s.endsWith(':'))s=s.slice(0,-1);if(s.includes(':')){const[m,x]=s.split(':');return(parseFloat(m)||0)*60+(parseFloat(x)||0)}return parseFloat(s)};
const ft=x=>{const r=Math.round(x*100)/100;if(r<60)return r.toFixed(2);const m=Math.floor(r/60);return m+':'+(r-m*60).toFixed(2).padStart(5,'0')};
const TAU=1.2,RT=.15;
const tfd=(d,v)=>{let lo=0,hi=60;for(let k=0;k<50;k++){const m=(lo+hi)/2;if(v*(m-TAU*(1-Math.exp(-m/TAU)))<d)lo=m;else hi=m}return(lo+hi)/2};
const vmax=t=>100/Math.max(t-RT-TAU,5);
const tad=(a,d)=>{const p=[[100,pt(a.pb100)],[200,pt(a.pb200)],[400,pt(a.pb400)]].filter(x=>x[1]>0);if(!p.length)return null;if(p.length==1)return p[0][1]*Math.pow(d/p[0][0],1.08);let i=0;while(i<p.length-2&&d>p[i+1][0])i++;const[d1,t1]=p[i],[d2,t2]=p[i+1];let b=Math.log(t2/t1)/Math.log(d2/d1);if(d>d2){b=Math.min(1.25,Math.max(b,1.1));return t2*Math.pow(d/d2,b)}b=Math.min(1.25,Math.max(1,b));return t1*Math.pow(d/d1,b)};
const acc=d=>d<=100?1.35:1.35+Math.min(.65,(d-100)/300*.65);
const env=()=>1+(S.surface==='dirt'?.022:0)+(S.shoe==='running'?.017:0)+(S.climate==='cold'?.013:0);
const okV=v=>v>=10&&v<=2000,okR=r=>r>=1&&r<=50,okT=(f,t)=>{if(String(t).trim()==='')return true;const v=pt(t),r={pb100:[7,40],pb200:[15,80],pb400:[35,200]}[f]||[1,400];return v>=r[0]&&v<=r[1]};
const bad=(k,f,v)=>k==='s'?(f==='v'?!okV(+v):f==='r'?!okR(+v):f==='i'?(v!==''&&!(v>=50&&v<=100)):0):(k==='a'&&/^pb/.test(f))?!okT(f,v):0;
const sets=()=>S.sets.filter(s=>okV(+s.v)&&okR(+s.r));
const setI=s=>s.i>=50&&s.i<=100?+s.i:S.intensity,setZ=s=>s.p||zk(setI(s));
function tgt(a,d,I,z){ // 秒を返す。計算できなければ null
 const form=+S.form||1,fly=S.start==='fly';let t;
 const t200=pt(a.pb200)>0?pt(a.pb200):tad(a,200);if(!(t200>0))return null;
 if(z==='rec'||z==='ext'||z==='int'){let v=200/(t200/form);if(d>200){const b=tad(a,d);if(!b)return null;v=d/(b/form)}
  t=d/(v*I/100);if(d<100&&!fly){const t100=pt(a.pb100)>0?pt(a.pb100):t200/2.06;t=Math.max(t,RT+tfd(d,vmax(t100/form)*I/100))}}
 else if(d<100){let t100=pt(a.pb100);if(!(t100>0)){const t2=pt(a.pb200),t4=pt(a.pb400);t100=t2>0?t2/2.06:(t4>0?t4/4.6:NaN)}if(!(t100>0))return null;t100/=form;const v=vmax(t100)*I/100;t=fly?d/v*1.03:RT+tfd(d,v)}
 else{const b=tad(a,d);if(!b)return null;const x=b/form,c=acc(d);t=((x-c)/(I/100)+c)}
 t*=env();if(!fly){if(S.timing==='manual')t-=.24;if(S.start==='stand')t+=.25}return t>0?t:null}
const sf=I=>{const[,lo,hi]=SEASON[S.season]||SEASON.build,k=Math.min(1,Math.max(0,(I-85)/10));return lo+(hi-lo)*k};
const lf=(lv,I)=>1+(L().lf[lv-1]-1)*Math.min(1,Math.max(0,(I-60)/30));
const cap=(lv,ev,I,z)=>Math.max(50,Math.round(L().cap[z][ev==='400'?1:0]*lf(lv,I)*(S.climate==='cold'?.9:1)*sf(I)/50)*50);
const mrep=(z,lv,ev)=>Math.round(L().rep[z][lv-1]*(['ext','int','se','se2'].includes(z)?(L().er[{'100':0,'200':1,'400':2}[ev]||0]||1):1)/10)*10;
function judge(a){const lv=a.level||3,ev=a.event||'100';let sh=0,bad=null,hr=0;
 sets().forEach(s=>{const z=setZ(s),I=setI(s);sh+=s.v*s.r/cap(lv,ev,I,z);if(!bad&&s.v>mrep(z,lv,ev))bad=s.v+'mは1本'+mrep(z,lv,ev)+'m超';if(z==='se2'||z==='max')hr+=+s.r});
 const ro=hr>L().mr[lv-1];let st=sh>1.25?'bad':sh>1?'warn':(bad||ro)?'warn':'ok';
 return{st,sh,sug:sh>1?sets().map(s=>s.v+'m×'+Math.max(1,Math.floor(s.r/sh))+'本').join(' / '):'',why:[sh>1?'総量':'',bad||'',ro?hr+'本は多い':''].filter(Boolean).join('・')}}
const toSec=t=>{t=String(t||'').replace(/[（(].*?[）)]/g,'');const m=[...t.matchAll(/(\d+(?:\.\d+)?)\s*(分|秒)?/g)].map(x=>({v:+x[1],u:x[2]}));if(!m.length)return null;let u=null;for(let i=m.length-1;i>=0;i--){if(m[i].u)u=m[i].u;else m[i].u=u||'分'}const s=m.map(x=>x.u==='分'?x.v*60:x.v);return s.reduce((a,b)=>a+b)/s.length};
const fs_=x=>x<120?Math.max(10,Math.round(x/10)*10)+'秒':(Math.round(x/30)/2)+'分';
const restTxt=s=>{if(s.rest&&s.rest.trim())return s.rest.trim();const z=setZ(s),r=REST[z](s.v);if(!r)return'ウォークバック';const a=fs_(r[0]),b=fs_(r[1]);return(a.slice(-1)===b.slice(-1)?a.slice(0,-1):a)+'〜'+b+(z==='ext'?'（歩いて戻る）':'')};
const present=()=>S.athletes.filter(a=>a.on&&a.name.trim());
function dur(){let run=0,rest=0;const NS=sets().length;sets().forEach((s,i)=>{const v=present().map(a=>tgt(a,s.v,setI(s),setZ(s))).filter(x=>x>0),r=v.length?v.reduce((x,y)=>x+y)/v.length:s.v*.17,rs=toSec(restTxt(s))??s.v/1.3;run+=s.r*r;const pk=Math.max(1,Math.min(+s.pb||1,+s.r)),bl=Math.ceil(s.r/pk),ri=toSec(s.restIn)??60;rest+=(s.r-bl)*ri+(bl-1)*rs+(i<NS-1?rs:0)});return{run,rest}}
/* ---- 表示 ---- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(l,v,c)=>l.map(x=>`<option value="${x[0]}"${String(x[0])===String(c)?' selected':''}>${x[1]}</option>`).join('');
const ZC={rec:'#94a3b8',ext:'#38bdf8',int:'#14b8a6',se:'#f59e0b',se2:'#ef4444',max:'#a855f7'},TI={today:'📝',times:'📊',meas:'⏱️',week:'📅',roster:'👥',conf:'⚙️'};
const TABS=[['today','メニュー'],['times','タイム'],['meas','計測'],['week','週'],['roster','名簿'],['conf','設定']];
const inN=(k,id,f,v,ph)=>`<input type="number" inputmode="numeric" data-k=${k} data-id=${id} data-f=${f} value="${v}"${ph!=null?` placeholder="${ph}"`:''} class="${bad(k,f,v)?'err':''}">`;

 customDistances:S.sets.map(s=>({...(s.o||{}),id:s.id,value:+s.v,reps:+s.r,purpose:s.p,intensity:s.i===''?'':+s.i,rest:s.rest||'',perBlock:+s.pb||1,restIn:s.restIn||''}))};
 return d}
const bkInfo=()=>{const d=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null,w=d===null||d>=30;return{w,t:d===null?'バックアップ未実施です。定期的に保存してください。':d===0?'本日バックアップ済み':'最終バックアップ '+d+'日前'+(w?'（30日以上たっています）':'')}};
const mark=()=>{S.lastBackup=Date.now();save()};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bk())],{type:'application/json'}));a.download='sprint_backup_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';a.click();URL.revokeObjectURL(a.href);mark();render()}
function bcopy(){const t=JSON.stringify(bk());if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{mark();render();toast('バックアップをコピーしました。メモやLINEなどに貼り付けて保管できます。')});else ask('全体を選んでコピーしてください',{input:1,def:t,cancel:'',ok:'閉じる'})}
async function bshare(){const f=new File([JSON.stringify(bk())],'sprint_backup.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});mark();render()}catch(e){}}else bcopy()}
async function bpaste(){const t=document.getElementById('bt');try{await imp(JSON.parse(t.value))}catch(e){toast('貼り付けた内容を読み込めませんでした')}}
function shareText(){const h='【'+S.date.replace(/-/g,'/')+' 今日の練習】\n'+sets().map(s=>`${s.v}m×${s.r}本（${sumLine(s)}）`).join('\n')+'\n\n';
 const b=present().map(a=>a.name+'：'+sets().map(s=>{const t=tgt(a,s.v,setI(s),setZ(s));return s.v+'m '+(t?ft(t):'―')}).join(' / ')).join('\n');const t=h+b;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('コピーしました'));else ask('全体を選んでコピーしてください',{input:1,def:t,cancel:'',ok:'閉じる'})}
function ask(msg,o){o=o||{};return new Promise(res=>{const d=$('#dlg');d.innerHTML='<div class="dbox"><p>'+esc(msg)+'</p>'+(o.input?'<textarea id="dli" class="w" rows="'+(o.def&&o.def.length>80?5:1)+'">'+esc(o.def||'')+'</textarea>':'')+'<div class="row" style="justify-content:flex-end;margin-top:8px">'+(o.cancel===''?'':'<button data-dl=0>'+(o.cancel||'キャンセル')+'</button>')+'<button class="p" data-dl=1>'+(o.ok||'OK')+'</button></div></div>';d.style.display='flex';d.onclick=e=>{const b=e.target.closest('[data-dl]');if(!b)return;const ok=b.dataset.dl==='1',v=o.input?document.getElementById('dli').value:null;d.style.display='none';d.innerHTML='';res(o.input?(ok?v:null):ok)}})}
let undoSnap=null,sbT=null;
const setPath=(p,v)=>{if(!S.lim)S.lim=JSON.parse(JSON.stringify(base()));const a=p.split('.');let o=S.lim;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v};
const snap=()=>JSON.stringify({sets:S.sets,athletes:S.athletes,wlog:S.wlog,menus:S.menus,hist:S.hist,tm:S.tm});
function toast(msg,sn){const el=$('#sb');undoSnap=sn||null;el.innerHTML='<span>'+msg+'</span>'+(sn?'<button data-act=undo>元に戻す</button>':'');el.style.display='flex';clearTimeout(sbT);sbT=setTimeout(()=>{el.style.display='none';undoSnap=null},8000)}
const upd=el=>{const k=el.dataset.k;if(!k)return 0;if(k==='ms'){S.sel[el.dataset.f]=+el.value;save();return 1}const f=el.dataset.f,id=+el.dataset.id;let v=el.type==='checkbox'?(el.checked?1:0):el.value;
 if(['v','r','i','intensity','level','wu','cd','form','pb'].includes(f)&&v!==''&&el.type!=='text')v=+v;
 if(k==='s'){const s=S.sets.find(x=>x.id===id);if(f==='p'){s.p=v;if(v)s.i=STD[v]}else s[f]=v}else if(k==='a')S.athletes.find(x=>x.id===id)[f]=v;else if(k==='L'){if(v!==''&&!isNaN(+v))setPath(f,+v)}else if(k==='N')S.notes[f]=v;else S[f]=v;if(f==='team')S.lim=null;
 if(el.classList)el.classList.toggle('err',!!bad(k,f,v));save();return 1};
document.addEventListener('toggle',e=>{const i=e.target.id;if(i==='md')S.mo=e.target.open?1:0;if(i==='gd')S.go=e.target.open?1:0},true);
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-fast]');if(!b)return;const f=b.dataset.fast,now=Date.now();if(!S.run.gs)S.run=RUN0();
 if(f==='start'&&S.run.stage==='ready'){S.run=newRun(now);S.restEnd=0;try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(x){}}
 else if(S.run.stage==='run'&&(f==='goal'||f==='gstart')){const g=S.run.gs[+b.dataset.g];if(!g)return;const rel=now-S.run.t0;if(f==='goal'){if(g.off==null)return;g.abs.push(rel);try{navigator.vibrate&&navigator.vibrate(20)}catch(x){}}else if(g.off==null){g.off=rel;try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}}else return}
 else return;save();render();e.preventDefault()});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.k||el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date')return;upd(el);if(!el.dataset.nr)refresh()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.k)return;if(el.tagName!=='SELECT'&&el.type!=='checkbox'&&el.type!=='date'&&!el.dataset.rr)return;upd(el);render()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,sid=b.dataset.id,id=+sid;
 if(a==='tab'){S.tab=sid;scrollTo(0,0)}else if(a==='info'){S.tab='conf';S.help=sid;render();const h=document.getElementById('h-'+sid);if(h)h.scrollIntoView();return}
 else if(a==='addset')S.sets.push({id:S.nid++,v:100,r:1,p:'',i:'',rest:''});else if(a==='delset'){const sn=snap();S.sets=S.sets.filter(x=>x.id!==id);toast('セットを削除しました',sn)}
 else if(a==='addath')S.athletes.push({id:S.nid++,name:'選手'+S.nid,pb100:'',pb200:'',pb400:'',level:3,event:'100',on:1});else if(a==='delath'){const sn=snap();S.athletes=S.athletes.filter(x=>x.id!==id);toast('選手を削除しました',sn)}
 else if(a==='inc'||a==='dec'){const t=S.sets.find(x=>x.id===id),f=b.dataset.f;t[f]=Math.max(f==='v'?10:1,(+t[f]||0)+(+b.dataset.d)*(a==='dec'?-1:1))}
 else if(a==='qs'){const q=QS[sid];S.sets.push({id:S.nid++,v:q[0],r:q[1],p:sid,i:STD[sid],rest:''})}
 else if(a==='msave'){const n=(document.getElementById('mn').value||'').trim()||'メニュー'+(S.menus.length+1);S.menus.push({id:S.nid++,name:n,intensity:S.intensity,env:{surface:S.surface,shoe:S.shoe,climate:S.climate,timing:S.timing,season:S.season,start:S.start,form:S.form},sets:S.sets.map(({v,r,p,i,rest,pb,restIn})=>({v,r,p,i,rest,pb,restIn}))});S.mo=1;toast('「'+n+'」を保存しました')}
 else if(a==='mload'||a==='hload'){const m=(a==='mload'?S.menus:S.hist).find(x=>x.id===id);if(m){S.sets=m.sets.map(x=>({...x,id:S.nid++}));if(m.intensity)S.intensity=m.intensity;if(m.season)S.season=m.season;toast('メニューを呼び出しました')}}
 else if(a==='mdel'){const sn=snap();S.menus=S.menus.filter(x=>x.id!==id);toast('メニューを削除しました',sn)}
 else if(a==='hdel'){const sn=snap();S.hist=S.hist.filter(x=>x.id!==id);toast('履歴を削除しました',sn)}
 else if(a==='hsave'){S.hist=S.hist.filter(h=>h.date!==S.date);S.hist.push({id:S.nid++,date:S.date,intensity:S.intensity,season:S.season,sets:S.sets.map(({v,r,p,i,rest,pb,restIn})=>({v,r,p,i,rest,pb,restIn}))});S.mo=1;toast(S.date.replace(/-/g,'/')+' の練習を保存しました')}
 else if(a==='hlast'){const h=[...S.hist].sort((x,y)=>y.date.localeCompare(x.date))[0];if(h){S.sets=h.sets.map(x=>({...x,id:S.nid++}));S.intensity=h.intensity||S.intensity;toast(h.date.replace(/-/g,'/')+' のメニューをコピーしました')}else toast('履歴がありません')}
 else if(a==='bulk'){const L=(document.getElementById('bn').value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);L.forEach(l=>{const c=l.split(/[,\t、]/).map(x=>x.trim()),lv=+c[4],ev=String(c[5]||'').replace(/\D/g,'');S.athletes.push({id:S.nid++,name:c[0],pb100:c[1]||'',pb200:c[2]||'',pb400:c[3]||'',level:lv>=1&&lv<=5?lv:3,event:['100','200','400'].includes(ev)?ev:'100',on:1})});if(L.length)toast(L.length+'名を追加しました')}
 else if(a==='nadd'){const ss=sets().filter(x=>setZ(x)===sid);if(!ss.length){toast('この目的に当てはまるセットが、メニューにありません。');return}S.notes[sid]=(S.notes[sid]?S.notes[sid]+'\n':'')+S.date.replace(/-/g,'/')+' '+ss.map(x=>`${x.v}m×${x.r}本(${setI(x)}%)`).join(' / ');S.help=sid}
 else if(a==='mend'){S.run.stage='assign';S.run.gi=Math.max(0,S.run.gs.findIndex(e=>e.abs.length))}
 else if(a==='mundo'){const e=S.run.gs[id];if(e)e.abs.pop()}
 else if(a==='mabort'){if(!(await ask('この計測を破棄しますか？',{ok:'破棄する'})))return;S.run=RUN0()}
 else if(a==='mgi'){S.run.gi=id}
 else if(a==='mact'){S.run.gs[S.run.gi].act=id}
 else if(a==='moff'){const e=S.run.gs[S.run.gi];e.adj=(e.adj||0)+id*100}
 else if(a==='masg'){const e=S.run.gs[S.run.gi],m=membersOf(e.g);(e.asg[e.act]=e.asg[e.act]||[]).push(id);if(e.abs.length>=m.length){const nx=e.abs.findIndex((_,i)=>!(e.asg[i]&&e.asg[i].length));if(nx>=0)e.act=nx}}
 else if(a==='munasg'){const e=S.run.gs[S.run.gi];Object.keys(e.asg).forEach(k=>{if(e.asg[k].includes(id)){e.asg[k]=e.asg[k].filter(x=>x!==id);e.act=+k}})}
 else if(a==='msv'){const R=S.run,s=curSet();let left=0;R.gs.forEach(e=>{const u=new Set(Object.values(e.asg).flat());left+=membersOf(e.g).filter(x=>!u.has(x.id)).length});
  if(left&&!(await ask('未割り当ての'+left+'名は、記録されません。保存しますか？',{ok:'保存する'})))return;
  let n=0;R.gs.forEach(e=>{const res=[];e.abs.forEach((x,i)=>(e.asg[i]||[]).forEach(aid=>res.push({a:aid,t:(x-(e.off||0)+(e.adj||0))/1000})));if(!res.length)return;n+=res.length;S.tm=S.tm.filter(r=>!(r.date===S.date&&r.sid===s.id&&r.rep===S.sel.rep&&r.g===e.g));S.tm.push({id:S.nid++,date:S.date,sid:s.id,v:s.v,rep:S.sel.rep,g:e.g,z:setZ(s),I:setI(s),res})});
  S.run=RUN0();S.restEnd=Date.now()+(toSec(restTxt(s))??s.v/1.3)*1000;if(S.sel.rep<+s.r)S.sel.rep++;toast('記録を保存しました（'+n+'名）。次は '+S.sel.rep+'本目です')}
 else if(a==='mrdel'){const sn=snap();S.tm=S.tm.filter(x=>x.id!==id);toast('記録を削除しました',sn)}
 else if(a==='mshare'){const t='【'+S.date.replace(/-/g,'/')+' 計測記録】\n'+S.tm.filter(r=>r.date===S.date).sort((a,b)=>a.id-b.id).map(r=>r.v+'m '+r.rep+'本目 '+glab(r.g)+'\n'+[...r.res].sort((a,b)=>a.t-b.t).map(x=>{const a=S.athletes.find(y=>y.id===x.a);return a?a.name+' '+ft(x.t):''}).join('\n')).join('\n\n');if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('コピーしました'));else ask('全体を選んでコピーしてください',{input:1,def:t,cancel:'',ok:'閉じる'});return}
 else if(a==='gpick'){if(S.gsel==null)S.gsel=id;else if(S.gsel===id)S.gsel=null;else{const m=gidx(),A=S.gsel;if(m[A]!==m[id]){gfreeze();S.gfix[A]=m[id];S.gfix[id]=m[A]}S.gsel=null}}
 else if(a==='gmove'){if(S.gsel!=null){const m=gidx();if(m[S.gsel]!==id){gfreeze();S.gfix[S.gsel]=id}}S.gsel=null}
 else if(a==='gnew'){gfreeze();S.gn=(+S.gn||1)+1}
 else if(a==='gauto'){S.gfix=null;S.gn=0;S.gsel=null}
 else if(a==='allon'||a==='alloff')S.athletes.forEach(x=>x.on=a==='allon'?1:0);
 else if(a==='wprev'||a==='wnext'){const d=pY(S.date);d.setDate(d.getDate()+(a==='wprev'?-7:7));S.date=ymd(d)}
 else if(a==='wrec')S.wlog[sid]={rest:false,sets:sets().map(s=>({value:+s.v,reps:+s.r,intensity:setI(s),purpose:s.p||''}))};
 else if(a==='wrest')S.wlog[sid]={rest:true,sets:[]};else if(a==='wclr'){const sn=snap();delete S.wlog[sid];toast('この日の記録を消しました',sn)}else if(a==='undo'){if(undoSnap){const o=JSON.parse(undoSnap);S.sets=o.sets;S.athletes=o.athletes;S.wlog=o.wlog;if(o.menus)S.menus=o.menus;if(o.tm)S.tm=o.tm;if(o.hist)S.hist=o.hist;undoSnap=null;$('#sb').style.display='none'}}
 else if(a==='wmatch'){const n=await ask('試合の名称（任意）',{input:1,def:(S.wlog[sid]&&S.wlog[sid].label)||'',ok:'決定'});if(n===null)return;S.wlog[sid]={rest:false,match:true,label:n.trim(),sets:[]}}
 else if(a==='export')return exp();else if(a==='import')return $('#f').click();else if(a==='share')return shareText();else if(a==='print')return doPrint();else if(a==='bshare')return bshare();else if(a==='bcopy')return bcopy();else if(a==='bpaste')return bpaste();save();render()});
setInterval(()=>{const R=S.run;document.querySelectorAll('[data-tmr]').forEach(el=>{const e=R&&R.gs&&R.gs[+el.dataset.tmr];if(!e||R.stage!=='run')return;el.textContent=e.off==null?'第1組のスタートから '+fmtMs(Date.now()-R.t0):fmtMs(Date.now()-R.t0-e.off)});const r=document.getElementById('rtm');if(r){const d=S.restEnd-Date.now();r.textContent=d>0?fmtMs(d):'レスト終了'}},50);
render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
